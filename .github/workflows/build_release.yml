name: Build ClassDelta

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（例如 v1.0.0）'
        required: true
        type: string
      primary_version:
        description: '主版本号，不带 v 前缀（例如 1.0.0 或 0.0.0.1）'
        required: true
        type: string
      source_ref:
        description: '手动运行时构建的源码分支/标签；留空则使用当前选择的分支'
        required: false
        type: string
        default: ''
      skip_signing:
        description: '跳过桌面代码签名（SignPath 尚未配置；Android APK 仍使用 keystore 签名）'
        required: false
        type: boolean
        default: true
      enable_android_build:
        description: '是否执行 Android 打包任务'
        required: false
        type: boolean
        default: true
      enable_gh_nuget_push:
        description: '推送 NuGet 包到 GitHub Packages'
        required: false
        type: boolean
        default: true
      enable_nuget_org_push:
        description: '推送 NuGet 包到 nuget.org（需要配置 NUGET_ORG_KEY）'
        required: false
        type: boolean
        default: false

env:
  PDC_CLIENT_VERSION: 1.0.1.0
  DOTNET_SDK_VERSION: 10.0.302
  MACOS_XCODE_PATH: /Applications/Xcode_26.6.app/Contents/Developer
  LANGUAGE_TAG: en-us
  GH_PACKAGES_USER: HuaLaNN-HS
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.source_ref || github.ref_name) || github.ref_name }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  PRIMARY_VERSION: ${{ github.event.inputs.primary_version || github.ref_name }}
  IS_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}

jobs:
  # Until SignPath OSS signing is approved/configured, this workflow deliberately
  # produces unsigned desktop packages. If a manual run unchecks Skip signing,
  # stop early rather than silently shipping unsigned files as if they were signed.
  validate_signing_mode:
    name: Validate Signing Mode
    runs-on: ubuntu-latest
    steps:
      - name: Confirm desktop signing is skipped
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_signing }}
        shell: bash
        run: echo "::notice::SignPath desktop signing is disabled; desktop artifacts will be unsigned."

      - name: Block until desktop signing is configured
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_signing }}
        shell: bash
        run: |
          echo "::error::SignPath signing is not configured for ClassDelta yet."
          echo "::error::Enable 'Skip signing' until the open-source signing application is approved and configured."
          exit 1

  # Windows: x64/x86/arm64, full + selfContained folder packages
  # Linux: x64/arm64, selfContained folder + deb packages
  # macOS: x64/arm64, selfContained pkg packages
  build_app:
    name: Build_AppBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    needs: [validate_signing_mode]
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-24.04' || (matrix.os == 'macos' && 'macos-26' || 'windows-2022') }}
    env:
      artifact_name: out_${{ matrix.package == 'folder' && 'appBase' || 'app' }}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'deb']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude:
          - os: linux
            arch: x86
          - os: windows
            package: deb
          - os: linux
            build_type: full
        include:
          - os: macos
            package: pkg
            build_type: selfContained
            arch: arm64
          - os: macos
            package: pkg
            build_type: selfContained
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.SOURCE_REF }}

      - name: Normalize version metadata for build scripts
        shell: bash
        env:
          INPUT_PRIMARY_VERSION: ${{ env.PRIMARY_VERSION }}
          INPUT_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          primary="${INPUT_PRIMARY_VERSION:-$INPUT_RELEASE_TAG}"
          primary="${primary#v}"
          if [[ ! "$primary" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid primary_version '$primary'. Use a numeric version such as 1.0.0 or 0.0.0.1."
            exit 1
          fi
          # The build scripts use `git describe --tags`. Add a local-only normalized
          # version tag at this checkout so a release tag like v1.0.0 is parsed as 1.0.0.
          if git show-ref --verify --quiet "refs/tags/$INPUT_RELEASE_TAG"; then
            git tag -d "$INPUT_RELEASE_TAG"
          fi
          git tag --force "$primary" "$(git rev-parse HEAD)"
          echo "PRIMARY_VERSION=$primary" >> "$GITHUB_ENV"
          echo "PDCC_primaryVersion=$primary" >> "$GITHUB_ENV"
          echo "appVersion=$primary" >> "$GITHUB_ENV"
          echo "Resolved primary version: $primary"

      - name: List files
        run: ls

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --info
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Install macOS workload
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        run: |
          sudo xcode-select -s "$MACOS_XCODE_PATH"
          xcodebuild -version
          xcodebuild -showsdks
          dotnet workload install macos --version "$DOTNET_SDK_VERSION"
          test "$(dotnet workload --version)" = "$DOTNET_SDK_VERSION"

      - name: Apply legacy macOS target-platform compatibility
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rqs --include='*.props' --include='*.csproj' 'net8\.0-macos15\.0' .; then
            echo "TargetPlatformVersion=15.0" >> "$GITHUB_ENV"
            echo "::notice::Detected legacy net8.0-macos15.0 source; TargetPlatformVersion=15.0 applied."
          fi

      - name: Add upstream GitHub Package Registry
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source --username ClassIsland --password "$env:GH_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"

      - name: Build App (Nuke)
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ env.IS_RELEASE }}
          test_signing_key: ${{ secrets.TEST_SIGNING_KEY }}
          ApiSigningKey: ${{ secrets.API_SIGNING_KEY }}
          ApiSigningKeyPs: ${{ secrets.API_SIGNING_KEY_PS }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildName: ${{ matrix.package == 'folder' && 'appBase' || 'app' }}
        run: ${{ matrix.os == 'windows' && 'pwsh -ep bypass ./build.ps1 PublishApp' || './build.sh PublishApp' }}

      - name: Upload Unsigned App Base
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            ./out/*.appx
            ./out/*.deb
            ./out/*.pkg
          if-no-files-found: error
          retention-days: 5

  # Android APKs use the Android keystore, independently of SignPath desktop signing.
  build_android:
    name: Build_Android_${{ matrix.arch }}
    needs: [validate_signing_mode]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_android_build }}
    runs-on: ubuntu-24.04
    env:
      artifact_name: out_app_android_${{ matrix.arch }}_monoaot_apk
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ['arm64', 'x64']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.SOURCE_REF }}

      - name: Normalize version metadata for build scripts
        shell: bash
        env:
          INPUT_PRIMARY_VERSION: ${{ env.PRIMARY_VERSION }}
          INPUT_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          primary="${INPUT_PRIMARY_VERSION:-$INPUT_RELEASE_TAG}"
          primary="${primary#v}"
          if [[ ! "$primary" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid primary_version '$primary'. Use a numeric version such as 1.0.0 or 0.0.0.1."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$INPUT_RELEASE_TAG"; then
            git tag -d "$INPUT_RELEASE_TAG"
          fi
          git tag --force "$primary" "$(git rev-parse HEAD)"
          echo "PRIMARY_VERSION=$primary" >> "$GITHUB_ENV"
          echo "PDCC_primaryVersion=$primary" >> "$GITHUB_ENV"
          echo "appVersion=$primary" >> "$GITHUB_ENV"

      - name: Verify Android build support in checked-out source
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Rqs --include='*.cs' 'PublishAndroidApp' ./build; then
            echo "::error::The checked-out source ref '${SOURCE_REF}' does not contain the NUKE target PublishAndroidApp."
            echo "::error::Use the Android-capable dev/misha-preview source or disable Android packaging."
            exit 1
          fi

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --info
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        shell: bash
        run: dotnet workload install android

      - name: Add upstream GitHub Package Registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source --username ClassIsland --password "$GH_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"

      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Add the Android signing secrets or disable Android packaging."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/classdelta-android.keystore"
          test -s "$RUNNER_TEMP/classdelta-android.keystore"

      - name: Build and sign Android APK
        env:
          AndroidKeyStore: true
          AndroidSigningKeyStore: ${{ runner.temp }}/classdelta-android.keystore
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AndroidSigningKeyAlias: ${{ vars.ANDROID_KEY_ALIAS }}
          arch: ${{ matrix.arch }}
          osName: android
          package: apk
          buildType: monoaot
          buildName: app
          isProductionBuild: ${{ env.IS_RELEASE == 'true' }}
        run: ./build.sh PublishAndroidApp

      - name: Verify Android APK signature
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: ${{ env.IS_RELEASE == 'true' && vars.ANDROID_APPLICATION_ID || vars.ANDROID_BETA_APPLICATION_ID }}
        run: |
          set -euo pipefail
          APK_PATH="$(find ./out -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER_PATH"
          "$APKSIGNER_PATH" verify --verbose "$APK_PATH"

          if [[ -n "${EXPECTED_APPLICATION_ID:-}" ]]; then
            AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
            test -n "$AAPT_PATH"
            "$AAPT_PATH" dump badging "$APK_PATH" | grep -F "package: name='$EXPECTED_APPLICATION_ID'"
          else
            echo "::notice::Android application ID variables are not configured; package-id verification was skipped."
          fi

      - name: Remove Android keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/classdelta-android.keystore"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ./out/*.apk
          if-no-files-found: error
          retention-days: 5

  build_launcher:
    name: Build_Launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    needs: [validate_signing_mode]
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    container: ${{ matrix.os == 'linux' && 'ghcr.io/classisland/philia-build-image:main' || '' }}
    env:
      artifact_name: out_launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['aot']
        package: ['singleFile']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude:
          - os: linux
            arch: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.SOURCE_REF }}

      - name: List files
        run: ls

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --info
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Setup Philia Environment
        if: ${{ matrix.os == 'linux' }}
        shell: bash
        run: |
          select-objcopy ${{ matrix.arch }}
          git config --global --add safe.directory '*'

      - name: Build Launcher (Nuke)
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ env.IS_RELEASE }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildName: launcher
        run: ${{ matrix.os == 'windows' && 'pwsh -ep bypass ./build.ps1 PublishLauncher' || './build.sh PublishLauncher' }}

      - name: Upload Unsigned Launcher
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ./out/*.zip
          if-no-files-found: error
          retention-days: 5

  # Create the app folder/installer packages from the uploaded app-base and launcher artifacts.
  pack_app:
    name: Pack_App_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    needs: [validate_signing_mode, build_app, build_launcher]
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-latest' }}
    env:
      artifact_name: out_app_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'installer']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude:
          - os: linux
            arch: x86
          - os: linux
            package: installer
          - build_type: full
            package: installer
          - os: linux
            build_type: full
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.SOURCE_REF }}

      - name: Normalize version metadata for pack scripts
        id: normalize_version
        shell: bash
        env:
          INPUT_PRIMARY_VERSION: ${{ env.PRIMARY_VERSION }}
          INPUT_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          primary="${INPUT_PRIMARY_VERSION:-$INPUT_RELEASE_TAG}"
          primary="${primary#v}"
          if [[ ! "$primary" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid primary_version '$primary'. Use a numeric version such as 1.0.0 or 0.0.0.1."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$INPUT_RELEASE_TAG"; then
            git tag -d "$INPUT_RELEASE_TAG"
          fi
          git tag --force "$primary" "$(git rev-parse HEAD)"
          echo "PRIMARY_VERSION=$primary" >> "$GITHUB_ENV"
          echo "PDCC_primaryVersion=$primary" >> "$GITHUB_ENV"
          echo "primary_version=$primary" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Combine Artifacts
        shell: pwsh
        run: pwsh -ep bypass ./tools/release-gen/combine-artifacts.ps1

      - name: Generate Package
        env:
          package: ${{ matrix.package }}
          isRelease: ${{ env.IS_RELEASE }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildType: ${{ matrix.build_type }}
        shell: pwsh
        run: pwsh -ep bypass ./tools/release-gen/pack/entry.ps1

      - name: Compile .iss to .exe Installer
        if: ${{ matrix.os == 'windows' && matrix.package == 'installer' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=${{ steps.normalize_version.outputs.primary_version }}
            /FClassDelta_app_${{ env.LANGUAGE_TAG }}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_installer
            /O${{ github.workspace }}\out_pack
            /DSourceDir=${{ github.workspace }}\out_pack\pack
            /DArch=${{ matrix.arch }}

      - name: Upload Packages and Installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ github.workspace }}/out_pack/*.zip
            ${{ github.workspace }}/out_pack/*.exe
          if-no-files-found: error
          retention-days: 5

  build_nupkg:
    name: Build_NuGet_Packages
    needs: [validate_signing_mode]
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.SOURCE_REF }}

      - name: Normalize version metadata for package scripts
        shell: bash
        env:
          INPUT_PRIMARY_VERSION: ${{ env.PRIMARY_VERSION }}
          INPUT_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          primary="${INPUT_PRIMARY_VERSION:-$INPUT_RELEASE_TAG}"
          primary="${primary#v}"
          if [[ ! "$primary" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid primary_version '$primary'. Use a numeric version such as 1.0.0 or 0.0.0.1."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$INPUT_RELEASE_TAG"; then
            git tag -d "$INPUT_RELEASE_TAG"
          fi
          git tag --force "$primary" "$(git rev-parse HEAD)"
          echo "PRIMARY_VERSION=$primary" >> "$GITHUB_ENV"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --info
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build NuGet Packages
        shell: pwsh
        env:
          is_release: ${{ env.IS_RELEASE }}
        run: ./build.ps1 BuildNupkg --isRelease $env:is_release

      - name: Add GitHub Packages Source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source --username $env:GH_PACKAGES_USER --password "$env:GH_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/$env:GH_PACKAGES_USER/index.json"

      - name: Push to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_gh_nuget_push }}
        shell: pwsh
        env:
          GHPKG_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push .\out\package\release\*.nupkg -k $env:GHPKG_KEY --source github --skip-duplicate

      - name: Validate nuget.org API key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_nuget_org_push }}
        shell: pwsh
        env:
          NUGET_KEY: ${{ secrets.NUGET_ORG_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_KEY)) {
            Write-Error "enable_nuget_org_push is enabled, but repository secret NUGET_ORG_KEY is empty."
          }

      - name: Push to nuget.org
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_nuget_org_push }}
        shell: pwsh
        env:
          NUGET_KEY: ${{ secrets.NUGET_ORG_KEY }}
        run: dotnet nuget push .\out\package\release\*.nupkg -k $env:NUGET_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload NuGet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out_nupkgs
          path: ./out/package/release/*.nupkg
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Prepare ClassDelta Release
    runs-on: ubuntu-latest
    needs: [pack_app, build_nupkg, build_android]
    if: ${{ always() && needs.pack_app.result == 'success' && needs.build_nupkg.result == 'success' && (needs.build_android.result == 'success' || needs.build_android.result == 'skipped') && github.event_name != 'pull_request' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) }}
    permissions:
      contents: write
    concurrency:
      group: classdelta-publish-public
    steps:
      - name: Validate Release Metadata
        shell: bash
        env:
          RELEASE_TAG_VALUE: ${{ env.RELEASE_TAG }}
          SOURCE_REF_VALUE: ${{ env.SOURCE_REF }}
          PRIMARY_VERSION_VALUE: ${{ env.PRIMARY_VERSION }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG_VALUE" ]]; then
            echo "::error::RELEASE_TAG is empty."
            exit 1
          fi
          if [[ -z "$SOURCE_REF_VALUE" ]]; then
            echo "::error::SOURCE_REF is empty."
            exit 1
          fi
          echo "Release tag: $RELEASE_TAG_VALUE"
          echo "Primary version input: $PRIMARY_VERSION_VALUE"
          echo "Source ref: $SOURCE_REF_VALUE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.SOURCE_REF }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      # Internal artifact names stay compatible with the build/pack scripts.
      # Only public release assets are renamed to ClassDelta.
      - name: Prepare ClassDelta Release Assets
        shell: bash
        env:
          ANDROID_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_android_build }}
        run: |
          set -euo pipefail
          rm -rf ./release_assets
          mkdir -p ./release_assets

          copy_one() {
            local artifact_dir="$1"
            local extension="$2"
            local target_name="$3"
            local root="./out_artifacts/$artifact_dir"

            if [[ ! -d "$root" ]]; then
              echo "::error::Artifact directory '$artifact_dir' does not exist."
              exit 1
            fi

            mapfile -t matches < <(find "$root" -maxdepth 2 -type f -name "*.$extension" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one *.$extension in '$artifact_dir', found ${#matches[@]}."
              printf '%s\n' "${matches[@]:-}"
              exit 1
            fi

            cp "${matches[0]}" "./release_assets/$target_name"
            test -s "./release_assets/$target_name"
          }

          # Windows: 6 folder ZIPs
          copy_one "out_app_windows_x64_full_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_windows_x64_full_folder.zip"
          copy_one "out_app_windows_x64_selfContained_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_windows_x64_selfContained_folder.zip"
          copy_one "out_app_windows_x86_full_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_windows_x86_full_folder.zip"
          copy_one "out_app_windows_x86_selfContained_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_windows_x86_selfContained_folder.zip"
          copy_one "out_app_windows_arm64_full_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_windows_arm64_full_folder.zip"
          copy_one "out_app_windows_arm64_selfContained_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_windows_arm64_selfContained_folder.zip"

          # Linux: 2 folder ZIPs + 2 Debian packages
          copy_one "out_app_linux_x64_selfContained_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_linux_x64_selfContained_folder.zip"
          copy_one "out_app_linux_arm64_selfContained_folder" "zip" "ClassDelta_app_${LANGUAGE_TAG}_linux_arm64_selfContained_folder.zip"
          copy_one "out_app_linux_x64_selfContained_deb" "deb" "ClassDelta_app_${LANGUAGE_TAG}_linux_x64_selfContained_deb.deb"
          copy_one "out_app_linux_arm64_selfContained_deb" "deb" "ClassDelta_app_${LANGUAGE_TAG}_linux_arm64_selfContained_deb.deb"

          # macOS: 2 PKG packages
          copy_one "out_app_macos_x64_selfContained_pkg" "pkg" "ClassDelta_app_${LANGUAGE_TAG}_macos_x64_selfContained_pkg.pkg"
          copy_one "out_app_macos_arm64_selfContained_pkg" "pkg" "ClassDelta_app_${LANGUAGE_TAG}_macos_arm64_selfContained_pkg.pkg"

          expected_count=12
          # Android: 2 APKs when enabled
          if [[ "$ANDROID_ENABLED" == "true" ]]; then
            copy_one "out_app_android_arm64_monoaot_apk" "apk" "ClassDelta_app_${LANGUAGE_TAG}_android_arm64_monoaot_apk.apk"
            copy_one "out_app_android_x64_monoaot_apk" "apk" "ClassDelta_app_${LANGUAGE_TAG}_android_x64_monoaot_apk.apk"
            expected_count=14
          fi

          actual_count="$(find ./release_assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$actual_count" -ne "$expected_count" ]]; then
            echo "::error::Expected $expected_count release assets, got $actual_count."
            exit 1
          fi

          echo "Prepared $actual_count ClassDelta release assets:"
          find ./release_assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release Draft
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./release_assets/*"
          artifactErrorsFailBuild: true
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ env.SOURCE_REF }}
          name: "ClassDelta ${{ env.RELEASE_TAG }}"
          body: "Auto-generated ClassDelta release for ${{ env.RELEASE_TAG }}. Desktop packages are unsigned while SignPath OSS signing is not configured."
          allowUpdates: true
